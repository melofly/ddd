name: CI (Docker + Tests)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB_AUTH: auth_db
      POSTGRES_DB_UNIVERSITY: university_db
      AUTH_SERVICE_INTERNAL_URL: http://auth-service:8000
      AUTH_SERVICE_API_URL: http://localhost:8000
      UNIVERSITY_SERVICE_INTERNAL_URL: http://university-service:8000
      UNIVERSITY_SERVICE_API_URL: http://localhost:8001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirmenets.txt

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Wait for Auth service
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/health; then
              echo "✅ Auth service is ready"
              break
            fi
            echo "⏳ Waiting for auth service..."
            sleep 2
          done

      - name: Wait for University service
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8001/health; then
              echo "✅ University service is ready"
              break
            fi
            echo "⏳ Waiting for university service..."
            sleep 2
          done

      - name: Stop Docker containers
        if: always()
        run: docker compose down
