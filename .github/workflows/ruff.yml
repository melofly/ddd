name: Lint (Ruff)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ruff-lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Run ruff (format check)
        run: ruff format --check .

      - name: Run ruff (lint)
        run: ruff check . --ignore F401,I001,F811,C416,N805,PLR2004,F821
