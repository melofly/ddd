[tool.ruff]

line-length = 88
target-version = "py313"
select = ["E", "F", "W", "C", "N", "I", "PD"]
extend-ignore = ["E203", "W503"]
exclude = ["build", "dist", ".venv", ".git", "__pycache__", "migrations"]

[tool.ruff.per-file-ignores]
"tests/*" = ["D", "S101"]
"scripts/*.py" = ["E402"]

[tool.ruff.tool]

